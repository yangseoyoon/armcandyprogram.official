<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>처벌 · 강제 | ARM CANDY PROGRAM</title>

    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    <link rel="stylesheet" href="folder-women-punishment.css" />
    <link rel="stylesheet" href="glitch-effect.css" />
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="cursor.css" />
    <script src="cursor.js" defer></script>
  </head>
  <body>
    <div class="stage">

      <!-- 캐비닛 배경 -->
      <div class="cabinet-bg" aria-hidden="true">
        <img src="images/folder-women-punishment/cabinet-bg.png" alt="" />
      </div>

      <!-- 어둠 효과 -->
      <a class="dark-overlay" href="folder-women.html" aria-label="닫기"></a>

      <!-- 열린 파일철 -->
      <div class="open-folder-bg" aria-hidden="true">
        <img src="images/folder-women-punishment/open-folder.png" alt="" />
      </div>

      <img class="paperclip" src="images/folder-women-punishment/paperclip.png" alt="" aria-hidden="true" />

      <!-- 오른쪽에 남은 인덱스 탭 이미지 (처벌강제 본인) -->
      <div class="index-tab index-tab--punishment" aria-hidden="true">
        <img src="images/folder-women-punishment/tab-punishment.png" alt="" />
      </div>

      <!-- 왼쪽으로 넘어간 신체변형, 의학적치료, 약물화학 탭 이미지 -->
      <div class="index-tab index-tab--bodymod-left" aria-hidden="true">
        <img src="images/folder-women-punishment/tab-body-mod-left.png" alt="" />
      </div>
      <div class="index-tab index-tab--medical-left" aria-hidden="true">
        <img src="images/folder-women-punishment/tab-medical-left.png" alt="" />
      </div>
      <div class="index-tab index-tab--drugchem-left" aria-hidden="true">
        <img src="images/folder-women-punishment/tab-drug-chem-left.png" alt="" />
      </div>

      <!-- 인덱스 라벨 (오른쪽) -->
      <a class="index-label index-label--punishment index-label--active" href="folder-women-punishment.html">
        <span>처벌 · 강제</span>
      </a>

      <!-- 인덱스 라벨 (왼쪽) -->
      <a class="index-label index-label--bodymod-left" href="folder-women-bodymod.html">
        <span>신체 변형</span>
      </a>
      <a class="index-label index-label--medical-left" href="folder-women-medical.html">
        <span>의학적 치료</span>
      </a>
      <a class="index-label index-label--drugchem-left" href="folder-women-drugchem.html">
        <span>약물 · 화학적 통제</span>
      </a>

      <!-- 파일 카드: 명예 살인 (처벌·강제 5페이지, 이전 장/다음 장 모두 있음) -->
      <div class="file-card-flat-wrap file-card-flat-wrap--honorkilling">
        <img
          class="file-card-flat"
          src="images/folder-women-punishment/card-honorkilling@2x.png"
          alt="명예 살인 자료 카드"
        />
        <a
          class="page-turn page-turn--prev"
          href="folder-women-punishment-4.html"
          aria-label="이전 장"
        ></a>
        <a
          class="page-turn page-turn--next"
          href="folder-women.html"
          aria-label="다음 장"
        ></a>
      </div>

    </div>

    <script src="glitch-effect.js"></script>
    <script src="folder-scale.js"></script>
  </body>
</html>
