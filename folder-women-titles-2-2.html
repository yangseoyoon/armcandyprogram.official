<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>악녀 | ARM CANDY PROGRAM</title>

    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />

    <link rel="stylesheet" href="folder-women-titles-open.css" />
    <link rel="stylesheet" href="glitch-effect.css" />
  </head>
  <body>
    <div class="stage">
      <!-- 캐비닛 배경 -->
      <div class="cabinet-bg" aria-hidden="true">
        <img src="images/folder-women/cabinet-bg.png" alt="" />
      </div>

      <!-- 어둠 효과 (클릭 시 여성의 호칭 파일철로 돌아가기) -->
      <a class="dark-overlay" href="folder-women-titles.html" aria-label="닫기"></a>

      <!-- 열린 파일철 (교정 사례와 동일한 범용 그래픽 재사용) -->
      <div class="open-folder-bg" aria-hidden="true">
        <img src="images/folder-women-punishment/open-folder.png" alt="" />
      </div>

      <img class="paperclip" src="images/folder-women-punishment/paperclip.png" alt="" aria-hidden="true" />

      <!-- 고정 탭: 어느 페이지에서 보든 항상 같은 자리, 라벨은 항상 "악녀" (Figma 원본 그대로) -->
      <div class="index-tab index-tab--fixed" aria-hidden="true">
        <img src="images/folder-women/tab-punishment.png" alt="" />
      </div>

      <!-- 이동 탭: 악녀 페이지에서는 왼쪽으로 밀려남 -->
      <div class="index-tab--roaming index-tab--roaming-far" aria-hidden="true">
        <img src="images/folder-women-punishment/tab-medical-left.png" alt="" />
      </div>

      <!-- 인덱스 라벨 (악녀: 고정) -->
      <a class="index-label index-label--villain" href="folder-women-titles-2.html">
        <span>악녀</span>
      </a>

      <!-- 인덱스 라벨 (성녀: 이동) -->
      <a class="index-label index-label--saint-far" href="folder-women-titles-1.html">
        <span>성녀</span>
      </a>

      <!-- 파일 카드 (임시 이미지: 실제 자료 이미지 파일로 직접 교체하면 됨) -->
      <div class="file-card-flat-wrap file-card-flat-wrap--1">
        <img
          class="file-card-flat"
          src="images/folder-women-titles/card-villain-3.png"
          alt="악녀 자료 카드 3"
        />
        <a class="page-turn page-turn--prev" href="folder-women-titles-2.html" aria-label="이전 장"></a>
      </div>
      <div class="file-card-flat-wrap file-card-flat-wrap--2">
        <img
          class="file-card-flat"
          src="images/folder-women-titles/card-villain-4.png"
          alt="악녀 자료 카드 4"
        />
        <a class="page-turn page-turn--next" href="folder-women-titles-2-3.html" aria-label="다음 장"></a>
      </div>

    </div>

    <script src="glitch-effect.js"></script>
    <script src="folder-scale.js"></script>
  </body>
</html>
