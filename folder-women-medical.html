<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>의학적 치료 | ARM CANDY PROGRAM</title>

    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    <link rel="stylesheet" href="folder-women-medical.css" />
    <link rel="stylesheet" href="glitch-effect.css" />
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="cursor.css" />
    <script src="cursor.js" defer></script>
  </head>
  <body>
    <div class="stage">

      <!-- 캐비닛 배경 -->
      <div class="cabinet-bg" aria-hidden="true">
        <img src="images/folder-women-medical/cabinet-bg.png" alt="" />
      </div>

      <!-- 어둠 효과 -->
      <a class="dark-overlay" href="folder-women.html" aria-label="닫기"></a>

      <!-- 열린 파일철 -->
      <div class="open-folder-bg" aria-hidden="true">
        <img src="images/folder-women-medical/open-folder.png" alt="" />
      </div>

      <img class="paperclip" src="images/folder-women-medical/paperclip.png" alt="" aria-hidden="true" />

      <!-- 오른쪽에 남은 인덱스 탭 이미지 (약물화학, 처벌강제, 의학적치료 본인) -->
      <div class="index-tab index-tab--punishment" aria-hidden="true">
        <img src="images/folder-women-medical/tab-punishment.png" alt="" />
      </div>
      <div class="index-tab index-tab--drugchem" aria-hidden="true">
        <img src="images/folder-women-medical/tab-drug-chem.png" alt="" />
      </div>
      <div class="index-tab index-tab--medical" aria-hidden="true">
        <img src="images/folder-women-medical/tab-medical.png" alt="" />
      </div>

      <!-- 왼쪽으로 넘어간 신체변형 탭 이미지 (이미 지나온 챕터, 좌우반전) -->
      <div class="index-tab index-tab--bodymod-left" aria-hidden="true">
        <img src="images/folder-women-medical/tab-body-mod.png" alt="" />
      </div>

      <!-- 인덱스 라벨 (오른쪽) -->
      <a class="index-label index-label--punishment" href="folder-women-punishment.html">
        <span>처벌 · 강제</span>
      </a>
      <a class="index-label index-label--drugchem" href="folder-women-drugchem.html">
        <span>약물 · 화학적 통제</span>
      </a>
      <a class="index-label index-label--medical index-label--active" href="folder-women-medical.html">
        <span>의학적 치료</span>
      </a>

      <!-- 인덱스 라벨 (왼쪽) -->
      <a class="index-label index-label--bodymod-left" href="folder-women-bodymod.html">
        <span>신체 변형</span>
      </a>

      <!-- 자료 카드: 처녀성 검사 / 전염병 예방법 (Figma에서 2x로 통짜 내보낸 이미지, 교정 사례 카드와 동일한 설정) -->
      <div class="file-card-flat-wrap file-card-flat-wrap--virginity">
        <img
          class="file-card-flat"
          src="images/folder-women-medical/card-virginity@2x.png"
          alt="처녀성 검사 자료 카드"
        />
      </div>
      <div class="file-card-flat-wrap file-card-flat-wrap--contagious">
        <img
          class="file-card-flat"
          src="images/folder-women-medical/card-contagious@2x.png"
          alt="전염병 예방법 자료 카드"
        />
        <a class="page-turn page-turn--next" href="folder-women-medical-2.html" aria-label="다음 장"></a>
      </div>

    </div>

    <script src="glitch-effect.js"></script>
    <script src="folder-scale.js"></script>
  </body>
</html>
