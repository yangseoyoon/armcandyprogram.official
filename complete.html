<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>신청 완료 | ARM CANDY PROGRAM</title>

    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="//cdn.jsdelivr.net/gh/neodgm/neodgm-pro-webfont@latest/neodgm_pro/style.css" />

    <link rel="stylesheet" href="complete.css" />
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="cursor.css" />
    <script src="cursor.js" defer></script>
  </head>
  <body>
    <div class="stage">

      <!-- 배경 패턴 -->
      <div class="bg-pattern" aria-hidden="true"></div>

      <!-- 신청완료 팝업 -->
      <div class="popup">
        <div class="popup-titlebar"></div>
        <a class="popup-close" href="apply.html" aria-label="닫기">
          <img src="images/complete/close-icon.svg" alt="" />
        </a>

        <img class="popup-badge" src="images/apply/badge.png" alt="ARM CANDY PROGRAM" />

        <h1 class="popup-title">신청 완료</h1>

        <div class="popup-body">
          <p>프로그램 신청이 완료되었습니다.</p>
          <p>해당 프로그램의 취소는 불가능하며</p>
          <p>대상자의 의지와는 상관없이</p>
          <p>강제적으로 프로그램이 진행됩니다.</p>
          <p>&nbsp;</p>
          <p>일주일 내로 담당 교정자가 방문할 것입니다.</p>
        </div>

        <div class="popup-photo-frame">
          <div class="popup-photo">
            <img src="images/complete/correctional-photo.png?v=2" alt="담당 교정자" />
          </div>
        </div>

        <p class="popup-agent">담당 교정자: ████</p>
      </div>

    </div>

    <audio id="correctAudio" src="audio/correct.mp3" preload="auto"></audio>

    <script src="scale.js"></script>
    <script>
      document.getElementById('correctAudio').play().catch(() => {});
    </script>
  </body>
</html>
