<!doctype html>
<html lang="ko">
  <head>

    <link rel="preconnect" href="https://cdn.jsdelivr.net" />

    <link rel="stylesheet" href="folder-women-people-politics.css" />
    <link rel="stylesheet" href="glitch-effect.css" />
    <link rel="stylesheet" href="fonts.css" />

  <body>
    <div class="stage">

      <!-- 캐비닛 배경 -->
      <div class="cabinet-bg" aria-hidden="true">
        <img src="images/folder-women-medical/cabinet-bg.png" alt="" />
      </div>

      <!-- 어둠 효과 -->
      <a class="dark-overlay" href="folder-women-people.html" aria-label="닫기"></a>

      <!-- 열린 파일철 -->
      <div class="open-folder-bg" aria-hidden="true">
        <img src="images/folder-women-medical/open-folder.png" alt="" />
      </div>

      <img class="paperclip" src="images/folder-women-medical/paperclip.png" alt="" aria-hidden="true" />

      <!-- 오른쪽에 남은 인덱스 탭 이미지 (약물화학, 처벌강제, 의학적치료 본인) -->
      <div class="index-tab index-tab--royal" aria-hidden="true">
        <img src="images/folder-women-medical/tab-drug-chem.png" alt="" />
      </div>
      <div class="index-tab index-tab--politics" aria-hidden="true">
        <img src="images/folder-women-medical/tab-medical.png" alt="" />
      </div>

      <!-- 왼쪽으로 넘어간 신체변형 탭 이미지 (이미 지나온 챕터, 좌우반전) -->
      <div class="index-tab index-tab--religion-left" aria-hidden="true">
        <img src="images/folder-women-medical/tab-body-mod.png" alt="" />
      </div>

      <!-- 인덱스 라벨 (오른쪽) -->
      <a class="index-label index-label--royal" href="folder-women-people-royal.html">
        <span>왕실·사회</span>
      </a>
      <a class="index-label index-label--politics index-label--active" href="folder-women-people-politics.html">
        <span>정치·권력</span>
      </a>

      <!-- 인덱스 라벨 (왼쪽) -->
      <a class="index-label index-label--religion-left" href="folder-women-people-religion.html">
        <span>종교·문화</span>
      </a>

      <!-- 자료 카드: 왼쪽 클레오파트라 7세(Figma 2584:206) / 오른쪽 측천무후(Figma 2585:355) -->
      <div class="file-card-flat-wrap file-card-flat-wrap--virginity">
        <img
          class="file-card-flat"
          src="images/folder-women-people-politics/card-cleopatra@2x.png?v=3"
          alt="클레오파트라 7세 자료 카드"
        />
        <!-- 카드에 찍힌 '이전 장' 글자 위의 클릭 영역: 앞 챕터(종교·문화)의 마지막 장으로 -->
        <a class="page-turn page-turn--prev" href="folder-women-people-religion-2.html" aria-label="이전 장"></a>
      </div>
      <div class="file-card-flat-wrap file-card-flat-wrap--contagious">
        <img
          class="file-card-flat"
          src="images/folder-women-people-politics/card-wuzetian@2x.png?v=3"
          alt="측천무후 자료 카드"
        />
        <a class="page-turn page-turn--next" href="folder-women-people-politics-2.html" aria-label="다음 장"></a>
      </div>

    </div>

    <script src="glitch-effect.js"></script>
