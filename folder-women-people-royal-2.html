<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>왕실·사회 | ARM CANDY PROGRAM</title>

    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    <link rel="stylesheet" href="folder-women-people-royal.css" />
    <link rel="stylesheet" href="folder-note-zoom.css" />
    <link rel="stylesheet" href="glitch-effect.css" />
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="cursor.css" />
    <script src="cursor.js" defer></script>
  </head>
  <body>
    <div class="stage">

      <!-- 캐비닛 배경 -->
      <div class="cabinet-bg" aria-hidden="true">
        <img src="images/folder-women-drugchem/cabinet-bg.png" alt="" />
      </div>

      <!-- 어둠 효과 -->
      <a class="dark-overlay" href="folder-women-people.html" aria-label="닫기"></a>

      <!-- 열린 파일철 -->
      <div class="open-folder-bg" aria-hidden="true">
        <img src="images/folder-women-drugchem/open-folder.png" alt="" />
      </div>

      <img class="paperclip" src="images/folder-women-drugchem/paperclip.png" alt="" aria-hidden="true" />

      <!-- 오른쪽에 남은 인덱스 탭 이미지 (처벌강제, 약물화학 본인) -->
      <div class="index-tab index-tab--royal" aria-hidden="true">
        <img src="images/folder-women-drugchem/tab-drug-chem.png" alt="" />
      </div>

      <!-- 왼쪽으로 넘어간 신체변형, 의학적치료 탭 이미지 -->
      <div class="index-tab index-tab--religion-left" aria-hidden="true">
        <img src="images/folder-women-drugchem/tab-body-mod-left.png" alt="" />
      </div>
      <div class="index-tab index-tab--politics-left" aria-hidden="true">
        <img src="images/folder-women-drugchem/tab-medical-left.png" alt="" />
      </div>

      <!-- 인덱스 라벨 (오른쪽) -->
      <a class="index-label index-label--royal index-label--active" href="folder-women-people-royal.html">
        <span>왕실·사회</span>
      </a>

      <!-- 인덱스 라벨 (왼쪽) -->
      <a class="index-label index-label--religion-left" href="folder-women-people-religion.html">
        <span>종교·문화</span>
      </a>
      <a class="index-label index-label--politics-left" href="folder-women-people-politics.html">
        <span>정치·권력</span>
      </a>

      <!-- 파일 카드: 왼쪽 마리 앙투아네트(Figma 2602:691) -->
      <div class="file-card-flat-wrap file-card-flat-wrap--placeholder-left">
        <img
          class="file-card-flat"
          src="images/folder-women-people-royal/card-marie-antoinette@2x.png?v=4"
          alt="마리 앙투아네트 자료 카드"
        />
        <!-- 카드 아래 노란 메모지: 누르면 크게 보인다 -->
        <button
          type="button"
          class="note-hotspot note-hotspot--marie-antoinette"
          data-note-zoom="noteMarieOverlay"
          aria-label="마리 앙투아네트 카드 메모지 크게 보기"
        ></button>
        <a
          class="page-turn page-turn--prev"
          href="folder-women-people-royal.html"
          aria-label="이전 장"
        ></a>
      </div>
      <!-- 파일 카드: 오른쪽 엘리자베트(Figma 2610:229). 카드에 '다음 장' 글자가 있지만 이 뒤에 이어지는 페이지가 아직 없어서 링크는 없음 -->
      <div class="file-card-flat-wrap file-card-flat-wrap--placeholder-right">
        <img
          class="file-card-flat"
          src="images/folder-women-people-royal/card-elisabeth@2x.png?v=4"
          alt="엘리자베트 자료 카드"
        />
        <!-- 카드 아래 노란 메모지: 누르면 크게 보인다 -->
        <button
          type="button"
          class="note-hotspot note-hotspot--elisabeth"
          data-note-zoom="noteElisabethOverlay"
          aria-label="엘리자베트 카드 메모지 크게 보기"
        ></button>
      </div>

      <!-- 마리 앙투아네트 카드 메모지 확대. 아무 곳이나 누르면 닫힌다 -->
      <div class="note-overlay note-overlay--marie-antoinette" id="noteMarieOverlay" aria-hidden="true">
        <img src="images/folder-women-people-royal/note-marie-antoinette@2x.png" alt="Qu'ils mangent de la brioche ! 그럼 그들에게 브리오슈를 먹으라고 하세요!" />
      </div>

      <!-- 엘리자베트 카드 메모지 확대. 아무 곳이나 누르면 닫힌다 -->
      <div class="note-overlay note-overlay--elisabeth" id="noteElisabethOverlay" aria-hidden="true">
        <img src="images/folder-women-people-royal/note-elisabeth@2x.png" alt="Ich bin eine Möwe von keinem Land, Meine Heimat nenne ich keinen Strand. 나는 어느 땅에도 속하지 않은 갈매기, 어떤 해안도 고향이라 부르지 않는다." />
      </div>
    </div>

    <script src="glitch-effect.js"></script>
    <script src="folder-scale.js"></script>
    <script src="folder-note-zoom.js"></script>
  </body>
</html>
