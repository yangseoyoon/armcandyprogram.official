<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>여성의 호칭 | ARM CANDY PROGRAM</title>

    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />

    <link rel="stylesheet" href="folder-women-titles.css" />
    <link rel="stylesheet" href="glitch-effect.css" />
  </head>
  <body>
    <div class="stage">
      <!-- 캐비닛 배경 (교정 사례 파일철 페이지와 동일한 배경 재사용) -->
      <div class="cabinet-bg" aria-hidden="true">
        <img src="images/folder-women/cabinet-bg.png" alt="" />
      </div>

      <!-- 어둠 효과 (클릭 시 서랍 닫고 돌아가기) -->
      <a class="dark-overlay" href="cabinet-women.html" aria-label="닫기"></a>

      <!-- 인덱스 탭 이미지 2개 (교정 사례 파일철과 동일한 tab-body-mod/tab-drug-chem 재사용) -->
      <div class="index-tab index-tab--saint" aria-hidden="true">
        <img src="images/folder-women/tab-body-mod.png" alt="" />
      </div>
      <div class="index-tab index-tab--villain" aria-hidden="true">
        <img src="images/folder-women/tab-drug-chem.png" alt="" />
      </div>

      <!-- 파일철 표지: 여성 호칭 리스트 -->
      <div class="folder-front" aria-hidden="true">
        <img src="images/folder-women-titles/folder-front.png" alt="여성 호칭 리스트" />
      </div>

      <!-- 인덱스 라벨 2개: 성녀 / 악녀 -->
      <a class="index-label index-label--saint" href="folder-women-titles-1.html">
        <span>성녀</span>
      </a>
      <a class="index-label index-label--villain" href="folder-women-titles-2.html">
        <span>악녀</span>
      </a>
    </div>

    <script src="glitch-effect.js"></script>
    <script src="folder-scale.js"></script>
  </body>
</html>
