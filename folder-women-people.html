<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>인물 목록 | ARM CANDY PROGRAM</title>

    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />

    <link rel="stylesheet" href="folder-women-people.css" />
    <link rel="stylesheet" href="glitch-effect.css" />
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="cursor.css" />
    <script src="cursor.js" defer></script>
  </head>
  <body>
    <div class="stage">
      <!-- 캐비닛 배경 -->
      <div class="cabinet-bg" aria-hidden="true">
        <img src="images/folder-women/cabinet-bg.png" alt="" />
      </div>

      <!-- 어둠 효과 (클릭 시 서랍 닫고 돌아가기) -->
      <a class="dark-overlay" href="cabinet-women.html" aria-label="닫기"></a>

      <!-- 파일철 뒷면 -->
      <div class="folder-back" aria-hidden="true">
        <img src="images/folder-women/folder-back.png" alt="" />
      </div>

      <!-- 인덱스 탭 이미지 4개 (전부 동일 크기/위치, 장식용이라 클릭 안 됨) -->
      <div class="index-tab index-tab--royal" aria-hidden="true">
        <img src="images/folder-women/tab-drug-chem.png?v=2" alt="" />
      </div>
      <div class="index-tab index-tab--politics" aria-hidden="true">
        <img src="images/folder-women/tab-medical.png?v=2" alt="" />
      </div>
      <div class="index-tab index-tab--religion" aria-hidden="true">
        <img src="images/folder-women/tab-body-mod.png?v=2" alt="" />
      </div>

      <!-- 인덱스 라벨 4개: 실제 클릭 영역은 이 텍스트들이며, 항상 탭 이미지들 위(맨 위) 레이어에 위치 -->
      <a
        class="index-label index-label--royal"
        href="folder-women-people-royal.html"
      >
        <span>왕실·사회</span>
      </a>
      <a
        class="index-label index-label--politics"
        href="folder-women-people-politics.html"
      >
        <span>정치·권력</span>
      </a>
      <a
        class="index-label index-label--religion"
        href="folder-women-people-religion.html"
      >
        <span>종교·문화</span>
      </a>

      <!-- 스탬프 -->
      <div class="stamp" aria-hidden="true">
        <img src="images/folder-women/stamp.png" alt="" />
      </div>

      <!-- 파일철 앞면 -->
      <div class="folder-front" aria-hidden="true">
        <img src="images/folder-women/folder-front.png" alt="" />
      </div>
    </div>

    <script src="glitch-effect.js"></script>
    <script src="folder-scale.js"></script>
  </body>
</html>
