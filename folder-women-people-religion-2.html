<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>종교·문화 | ARM CANDY PROGRAM</title>

    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />

    <link rel="stylesheet" href="folder-women-people-religion.css" />
    <link rel="stylesheet" href="folder-note-zoom.css" />
    <link rel="stylesheet" href="glitch-effect.css" />
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="cursor.css" />
    <script src="cursor.js" defer></script>
  </head>
  <body>
    <div class="stage">
      <!-- 캐비닛 배경 -->
      <div class="cabinet-bg" aria-hidden="true">
        <img src="images/folder-women-bodymod/cabinet-bg.png" alt="" />
      </div>

      <!-- 어둠 효과 -->
      <a class="dark-overlay" href="folder-women-people.html" aria-label="닫기"></a>

      <!-- 열린 파일철 -->
      <div class="open-folder-wrap">
        <a class="open-folder-bg" href="folder-women-people.html" aria-label="닫기">
          <img src="images/folder-women-bodymod/open-folder.png" alt="" />
        </a>

        <img
          class="paperclip"
          src="images/folder-women-bodymod/paperclip.png"
          alt=""
          aria-hidden="true"
        />

        <!-- 인덱스 탭 이미지 4개 -->
        <div class="index-tab index-tab--royal" aria-hidden="true">
          <img src="images/folder-women-bodymod/tab-drug-chem.png?v=2" alt="" />
        </div>
        <div class="index-tab index-tab--politics" aria-hidden="true">
          <img src="images/folder-women-bodymod/tab-medical.png?v=2" alt="" />
        </div>
        <div class="index-tab index-tab--religion" aria-hidden="true">
          <img src="images/folder-women-bodymod/tab-body-mod.png?v=2" alt="" />
        </div>

        <!-- 인덱스 라벨 4개 -->
        <a
          class="index-label index-label--royal"
          href="folder-women-people-royal.html"
        >
          <span>왕실·사회</span>
        </a>
        <a
          class="index-label index-label--politics"
          href="folder-women-people-politics.html"
        >
          <span>정치·권력</span>
        </a>
        <a
          class="index-label index-label--religion index-label--active"
          href="folder-women-people-religion.html"
        >
          <span>종교·문화</span>
        </a>

        <!-- 파일 카드: 왼쪽 잔 다르크(Figma 2602:1007) / 오른쪽 막달레나 마리아(Figma 2609:157) -->
        <div class="file-card-flat-wrap file-card-flat-wrap--fgm">
          <img
            class="file-card-flat"
            src="images/folder-women-people-religion/card-jeanne-darc@2x.png?v=4"
            alt="잔 다르크 자료 카드"
          />
          <!-- 카드 아래 노란 메모지: 누르면 크게 보인다 -->
          <button
            type="button"
            class="note-hotspot note-hotspot--jeanne-darc"
            data-note-zoom="noteJeanneOverlay"
            aria-label="잔 다르크 카드 메모지 크게 보기"
          ></button>
          <a
            class="page-turn page-turn--prev"
            href="folder-women-people-religion.html"
            aria-label="이전 장"
          ></a>
        </div>
        <div class="file-card-flat-wrap file-card-flat-wrap--breastironing">
          <img
            class="file-card-flat"
            src="images/folder-women-people-religion/card-mary-magdalene@2x.png?v=4"
            alt="막달레나 마리아 자료 카드"
          />
          <!-- 카드에 찍힌 '다음 장' 글자 위의 클릭 영역: 정치·권력 첫 페이지로 -->
          <a
            class="page-turn page-turn--next"
            href="folder-women-people-politics.html"
            aria-label="다음 장"
          ></a>
        </div>
      </div>

      <!-- 잔 다르크 카드 메모지 확대. 아무 곳이나 누르면 닫힌다 -->
      <div class="note-overlay note-overlay--jeanne-darc" id="noteJeanneOverlay" aria-hidden="true">
        <img src="images/folder-women-people-religion/note-jeanne-darc@2x.png" alt="Jehanne — 잔 다르크의 서명" />
      </div>
    </div>

    <script src="glitch-effect.js"></script>
    <script src="folder-scale.js"></script>
    <script src="folder-note-zoom.js"></script>
  </body>
</html>
